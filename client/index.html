<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL Connection Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 2rem;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
    }
    .subtitle {
      color: #666;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #444;
    }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #4361ee;
      box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.15);
    }
    .row {
      display: flex;
      gap: 1rem;
    }
    .row .form-group { flex: 1; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .checkbox-group input { width: auto; }
    .checkbox-group label { margin: 0; font-weight: 400; }
    button {
      width: 100%;
      padding: 0.625rem;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3a56d4; }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      display: block;
    }
    .result.loading {
      background: #cce5ff;
      border: 1px solid #b8daff;
      color: #004085;
      display: block;
    }
    .troubleshooting {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      font-size: 0.8125rem;
      color: #856404;
    }
    .troubleshooting h4 { margin-bottom: 0.5rem; }
    .troubleshooting ul { padding-left: 1.25rem; }
    .troubleshooting li { margin-bottom: 0.25rem; }
    .server-info {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #e9ecef;
      border-radius: 4px;
      font-size: 0.8125rem;
    }
    .server-info strong { color: #333; }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #dee2e6;
    }
    .tab {
      width: auto;
      padding: 0.5rem 1.25rem;
      background: transparent;
      color: #666;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: -2px;
      border-radius: 0;
    }
    .tab:hover { color: #4361ee; background: transparent; }
    .tab.active {
      color: #4361ee;
      border-bottom-color: #4361ee;
      background: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MySQL Connection Tester</h1>
    <p class="subtitle">
      Test MySQL connections and manage settings server-side, bypassing
      WAF/security challenges that block browser-based API requests.
    </p>

    <div class="tabs">
      <button class="tab active" data-tab="connection">Test Connection</button>
      <button class="tab" data-tab="settings">Save Settings</button>
    </div>

    <!-- Connection Test Tab -->
    <div id="tab-connection" class="tab-content active">
      <form id="connectionForm">
        <div class="row">
          <div class="form-group">
            <label for="host">Host</label>
            <input type="text" id="host" placeholder="localhost or IP address" required>
          </div>
          <div class="form-group" style="max-width: 120px;">
            <label for="port">Port</label>
            <input type="number" id="port" value="3306" placeholder="3306">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="user">Username</label>
            <input type="text" id="user" placeholder="root" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="password" required>
          </div>
        </div>

        <div class="form-group">
          <label for="database">Database (optional)</label>
          <input type="text" id="database" placeholder="my_database">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="ssl">
          <label for="ssl">Use SSL/TLS connection</label>
        </div>

        <button type="submit" id="testBtn">Test Connection</button>
      </form>

      <div id="result" class="result"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content">
      <form id="settingsForm">
        <div class="row">
          <div class="form-group">
            <label for="sHost">Host</label>
            <input type="text" id="sHost" placeholder="localhost or IP address" required>
          </div>
          <div class="form-group" style="max-width: 120px;">
            <label for="sPort">Port</label>
            <input type="number" id="sPort" value="3306" placeholder="3306">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="sUser">Username</label>
            <input type="text" id="sUser" placeholder="root" required>
          </div>
          <div class="form-group">
            <label for="sPassword">Password</label>
            <input type="password" id="sPassword" placeholder="password" required>
          </div>
        </div>

        <div class="form-group">
          <label for="sDatabase">Database</label>
          <input type="text" id="sDatabase" placeholder="my_database" required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="sSsl">
          <label for="sSsl">Use SSL/TLS connection</label>
        </div>

        <hr style="margin: 1rem 0; border: none; border-top: 1px solid #eee;">

        <div id="settingsRecords">
          <div class="settings-record row">
            <div class="form-group">
              <label>Key</label>
              <input type="text" class="rec-key" placeholder="setting_name" required>
            </div>
            <div class="form-group">
              <label>Value</label>
              <input type="text" class="rec-value" placeholder="setting_value">
            </div>
          </div>
        </div>

        <button type="button" id="addRecordBtn" style="width:auto; margin-bottom:1rem; padding:0.375rem 0.75rem; font-size:0.8125rem; background:#6c757d;">+ Add Record</button>

        <div class="row" style="gap: 0.5rem;">
          <button type="submit" id="saveBtn" style="flex:2;">Save Settings</button>
          <button type="button" id="loadBtn" style="flex:1; background:#28a745;">Load All</button>
        </div>
      </form>

      <div id="settingsResult" class="result"></div>
      <div id="settingsTable" style="margin-top:1rem; display:none;">
        <h4 style="font-size:0.875rem; margin-bottom:0.5rem;">Stored Settings</h4>
        <table style="width:100%; font-size:0.8125rem; border-collapse:collapse;">
          <thead>
            <tr style="text-align:left; border-bottom:2px solid #dee2e6;">
              <th style="padding:0.375rem;">Key</th>
              <th style="padding:0.375rem;">Value</th>
              <th style="padding:0.375rem;">Updated</th>
            </tr>
          </thead>
          <tbody id="settingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    /* -- Tab switching -- */
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    /* -- Shared helpers -- */
    function escapeHtml(str) {
      if (typeof str !== 'string') return String(str);
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function safeFetch(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      const contentType = response.headers.get('content-type') || '';

      if (!contentType.includes('application/json') && text.trim().startsWith('<')) {
        throw new Error(
          'Hosting security challenge returned HTML instead of JSON (HTTP ' + response.status + '). ' +
          'Refresh the page, then retry. If it repeats, this host is blocking API requests.'
        );
      }

      try {
        const data = JSON.parse(text);
        data._httpStatus = response.status;
        return data;
      } catch (parseErr) {
        throw new Error(
          'Invalid JSON response from server (HTTP ' + response.status + '). ' +
          'Response preview: ' + text.substring(0, 200)
        );
      }
    }

    function showResult(el, type, message) {
      el.className = 'result ' + type;
      el.innerHTML = message;
    }

    function renderTroubleshooting(steps) {
      if (!steps || steps.length === 0) return '';
      let html = '\n<div class="troubleshooting"><h4>Troubleshooting Steps:</h4><ul>';
      steps.forEach(function(step) { html += '<li>' + escapeHtml(step) + '</li>'; });
      html += '</ul></div>';
      return html;
    }

    /* -- Connection Test -- */
    const form = document.getElementById('connectionForm');
    const resultDiv = document.getElementById('result');
    const testBtn = document.getElementById('testBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      testBtn.disabled = true;
      testBtn.textContent = 'Testing...';
      showResult(resultDiv, 'loading', 'Connecting to MySQL server...');

      const payload = {
        host: document.getElementById('host').value.trim(),
        port: parseInt(document.getElementById('port').value, 10) || 3306,
        user: document.getElementById('user').value.trim(),
        password: document.getElementById('password').value,
        database: document.getElementById('database').value.trim() || undefined,
        ssl: document.getElementById('ssl').checked
      };

      try {
        const data = await safeFetch('/api/test-connection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (data.success) {
          let html = '<strong>Connection Successful!</strong>\n' + escapeHtml(data.message);
          if (data.server) {
            html += '\n<div class="server-info">';
            html += '<strong>Server Version:</strong> ' + escapeHtml(data.server.version) + '\n';
            html += '<strong>Host:</strong> ' + escapeHtml(data.server.host) + ':' + data.server.port + '\n';
            html += '<strong>Database:</strong> ' + escapeHtml(data.server.database) + '\n';
            if (data.server.databases && data.server.databases.length > 0) {
              html += '<strong>Available Databases:</strong> ' + data.server.databases.map(escapeHtml).join(', ');
            }
            html += '</div>';
          }
          if (data.latencyMs !== undefined) {
            html += '\n<em>Latency: ' + data.latencyMs + 'ms</em>';
          }
          showResult(resultDiv, 'success', html);
        } else {
          let html = '<strong>Connection Failed</strong>\n' + escapeHtml(data.message);
          if (data.error) {
            html += '\n\nError Code: ' + escapeHtml(data.error.code || 'Unknown');
            if (data.error.sqlMessage) {
              html += '\nSQL Message: ' + escapeHtml(data.error.sqlMessage);
            }
          }
          html += renderTroubleshooting(data.troubleshooting);
          showResult(resultDiv, 'error', html);
        }
      } catch (err) {
        let html = '<strong>Error</strong>\n' + escapeHtml(err.message);
        html += '\n<div class="troubleshooting"><h4>Troubleshooting Steps:</h4><ul>';
        html += '<li>Make sure the backend server is running (npm start).</li>';
        html += '<li>If you see an HTML security challenge error, your hosting WAF is blocking requests.</li>';
        html += '<li>Use the server-side proxy endpoint to bypass WAF restrictions.</li>';
        html += '<li>Check your hosting provider\'s firewall/WAF settings.</li>';
        html += '</ul></div>';
        showResult(resultDiv, 'error', html);
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = 'Test Connection';
      }
    });

    /* -- Settings Management -- */
    const settingsForm = document.getElementById('settingsForm');
    const settingsResultDiv = document.getElementById('settingsResult');
    const settingsTableDiv = document.getElementById('settingsTable');
    const settingsBody = document.getElementById('settingsBody');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const addRecordBtn = document.getElementById('addRecordBtn');

    function getSettingsCreds() {
      return {
        host: document.getElementById('sHost').value.trim(),
        port: parseInt(document.getElementById('sPort').value, 10) || 3306,
        user: document.getElementById('sUser').value.trim(),
        password: document.getElementById('sPassword').value,
        database: document.getElementById('sDatabase').value.trim(),
        ssl: document.getElementById('sSsl').checked
      };
    }

    addRecordBtn.addEventListener('click', function() {
      const container = document.getElementById('settingsRecords');
      const row = document.createElement('div');
      row.className = 'settings-record row';
      row.innerHTML =
        '<div class="form-group"><label>Key</label>' +
        '<input type="text" class="rec-key" placeholder="setting_name" required></div>' +
        '<div class="form-group"><label>Value</label>' +
        '<input type="text" class="rec-value" placeholder="setting_value"></div>';
      container.appendChild(row);
    });

    settingsForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      showResult(settingsResultDiv, 'loading', 'Saving settings to MySQL...');

      const creds = getSettingsCreds();
      const recordEls = document.querySelectorAll('.settings-record');
      const records = [];
      recordEls.forEach(function(el) {
        const key = el.querySelector('.rec-key').value.trim();
        const value = el.querySelector('.rec-value').value;
        if (key) records.push({ key: key, value: value });
      });

      if (records.length === 0) {
        showResult(settingsResultDiv, 'error', '<strong>Error</strong>\nAt least one setting key is required.');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Settings';
        return;
      }

      try {
        const data = await safeFetch('/api/save-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...creds, records: records })
        });

        if (data.success) {
          let html = '<strong>Settings Saved!</strong>\n' + escapeHtml(data.message);
          if (data.latencyMs !== undefined) {
            html += '\n<em>Latency: ' + data.latencyMs + 'ms</em>';
          }
          showResult(settingsResultDiv, 'success', html);
        } else {
          let html = '<strong>Save Failed</strong>\n' + escapeHtml(data.message);
          if (data.error) {
            html += '\n\nError Code: ' + escapeHtml(data.error.code || 'Unknown');
            if (data.error.sqlMessage) {
              html += '\nDetails: ' + escapeHtml(data.error.sqlMessage);
            }
            if (data.error.apiStatusCode) {
              html += '\nAPI Status: ' + data.error.apiStatusCode;
            }
          }
          if (data._httpStatus && data._httpStatus >= 400) {
            html += '\nHTTP Status: ' + data._httpStatus;
          }
          html += renderTroubleshooting(data.troubleshooting);
          showResult(settingsResultDiv, 'error', html);
        }
      } catch (err) {
        let html = '<strong>Error</strong>\n' + escapeHtml(err.message);
        html += '\n<div class="troubleshooting"><h4>Troubleshooting Steps:</h4><ul>';
        html += '<li>Make sure the backend server is running (npm start).</li>';
        html += '<li>Verify the database exists and the user has CREATE/INSERT privileges.</li>';
        html += '<li>Check your hosting provider\'s firewall/WAF settings.</li>';
        html += '</ul></div>';
        showResult(settingsResultDiv, 'error', html);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Settings';
      }
    });

    loadBtn.addEventListener('click', async function() {
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading...';
      showResult(settingsResultDiv, 'loading', 'Retrieving settings from MySQL...');

      const creds = getSettingsCreds();

      if (!creds.host || !creds.user || !creds.database) {
        showResult(settingsResultDiv, 'error', '<strong>Error</strong>\nHost, user, and database are required to load settings.');
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load All';
        return;
      }

      try {
        const data = await safeFetch('/api/get-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(creds)
        });

        if (data.success) {
          showResult(settingsResultDiv, 'success', '<strong>Loaded!</strong> ' + escapeHtml(data.message));
          if (data.settings && data.settings.length > 0) {
            settingsBody.innerHTML = '';
            data.settings.forEach(function(s) {
              const tr = document.createElement('tr');
              tr.style.borderBottom = '1px solid #dee2e6';
              tr.innerHTML =
                '<td style="padding:0.375rem;">' + escapeHtml(s.key) + '</td>' +
                '<td style="padding:0.375rem;">' + escapeHtml(s.value || '') + '</td>' +
                '<td style="padding:0.375rem;">' + escapeHtml(s.updatedAt || '') + '</td>';
              settingsBody.appendChild(tr);
            });
            settingsTableDiv.style.display = 'block';
          } else {
            settingsTableDiv.style.display = 'none';
          }
        } else {
          let html = '<strong>Load Failed</strong>\n' + escapeHtml(data.message);
          html += renderTroubleshooting(data.troubleshooting);
          showResult(settingsResultDiv, 'error', html);
          settingsTableDiv.style.display = 'none';
        }
      } catch (err) {
        showResult(settingsResultDiv, 'error', '<strong>Error</strong>\n' + escapeHtml(err.message));
        settingsTableDiv.style.display = 'none';
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load All';
      }
    });
  </script>
</body>
</html>
